# Vale overrides for the documentation checks (tox -e vale).
#
# WARNING: compare this file with upstream regularly. It names rules from the
# Canonical documentation style guide, and Vale silently ignores a name that no
# longer matches a rule, so an upstream rename would make an override stop
# applying without any error.
#
# This file is layered on top of the unmodified upstream vale.ini, which
# tests/lint/get-vale-config.sh downloads (at the upstream commit pinned there)
# and the vale tox env exposes to Vale as its global configuration. Only
# deviations from upstream belong here; each one is marked with an inline
# "# DEVIATION" comment. No rule is filtered out.

[*.md]
Canonical.000-US-spellcheck = warning  # DEVIATION: upstream is error; the project's technical terms are not in the dictionary
