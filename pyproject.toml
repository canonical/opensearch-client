#######################################
# PACKAGE                             #
#######################################

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opensearch_client"
version = "0.1.2"
description = "OpenSearch client library."
requires-python = ">=3.10"
dependencies = [
    "requests",
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
os-cli = "opensearch_client.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opensearch_client"]


#######################################
# TOX/TEST CONFIGS                    #
#######################################

[tool.tox]
requires = ["tox>=4.57", "tox-uv>=1.0.0"]
env_list = [
    "lint",
    "type",
    "hygiene",
    "doc-checks",
    # requires-python is >=3.10; 22.04 -> py310 | 24.04 -> py312 | 26.04 -> py314
    "unit-py310",
    "unit-py312",
    "unit-py314",
]

[tool.tox.env_run_base]
package = "wheel"
recreate = true
set_env = { PYTHONPATH = "{tox_root}/src" }

[tool.tox.env.lint]
base_python = "py312"
description = "Check code against coding style standards"
allowlist_externals = ["bash"]
skip_install = true
deps = [
    "ruff==0.15.20",
    "codespell",
]
commands = [
    ["bash", "tests/lint/ascii-check.sh", "py"],
    ["bash", "tests/lint/ascii-check.sh", "sh"],
    ["bash", "-c", "ruff check src tests || touch .fail"],
    ["bash", "-c", "ruff format --check src tests || touch .fail"],
    ["bash", "-c", "codespell . || touch .fail"],
    ["bash", "-c", "! test -f .fail || ( rm .fail && exit 1 )"],
]

[tool.tox.env.fmt]
description = "Automatically format code"
skip_install = true
deps = [
    "ruff==0.15.20",
    "codespell",
]
commands = [
    ["ruff", "check", "--fix", "src", "tests"],
    ["ruff", "format", "src", "tests"],
    ["codespell", "-w", "."],
]

[tool.tox.env.type]
description = "Type-check with basedpyright"
deps = [
    "basedpyright>=1.31.1",
    "pytest",
]
commands = [
    [
        "basedpyright",
        "--pythonpath", "{envpython}",
        "{tox_root}/src", "{tox_root}/tests",
    ],
]

[tool.tox.env.hygiene]
description = "Check for dead code"
deps = ["vulture"]
commands = [["vulture"]]

[tool.tox.env.doc-checks]
description = "Run doc checks"
package = "skip"
allowlist_externals = ["bash"]
deps = [
    "mdformat",
    "mdformat-gfm",
    "mdformat-pyproject",
    "pymarkdownlnt",
]
commands = [
    ["bash", "tests/lint/ascii-check.sh", "md"],
    ["mdformat", "--check", "README.md", "docs", "tests"],
    ["pymarkdown", "scan", "--recurse", "README.md", "docs", "tests"],
]

[tool.tox.env_base.unit]
factors = [["py310", "py312", "py314"]]
description = "Run unit tests"
deps = [
    "coverage[toml]",
    "pytest",
]
commands = [
    [
        "coverage",
        "run",
        "--source=src/opensearch_client",
        "-m",
        "pytest",
        "-s",
        "tests/unit/",
    ],
    ["coverage", "report"],
]

[tool.tox.env.functional]
description = "Run functional tests against a live OpenSearch cluster (see tests/functional/)"
deps = ["pytest"]
pass_env = [
    "OPENSEARCH_URL",
    "OPENSEARCH_HOST",
    "OPENSEARCH_PORT",
    "OPENSEARCH_USER",
    "OPENSEARCH_PASSWORD",
    "OPENSEARCH_CA_CERT",
    "OPENSEARCH_INSECURE",
    "OPENSEARCH_INDEX",
]
commands = [["pytest", "-s", "tests/functional/"]]

[tool.tox.env.actionlint]
description = "Lint GitHub Actions workflows with actionlint"
skip_install = true
deps = ["actionlint-py"]
commands = [["actionlint"]]


#######################################
# TOOL CONFIGS                        #
#######################################

[tool.pyright]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E, W, F: pycodestyle and pyflakes. I: import sorting. D: docstrings. A: names
# that shadow builtins. BLE: blind `except Exception`. N: naming. PLR0912: too
# many branches in one function.
select = ["E", "W", "F", "I", "D", "A", "BLE", "N", "PLR0912"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests do not need docstrings.
"tests/**" = ["D"]

[tool.codespell]
skip = [".venv", "venv", ".git", ".tox", ".pytest_cache", ".ruff_cache"]

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 60

[tool.mdformat]
wrap = 80

[tool.pymarkdown.extensions.markdown-tables]
enabled = true  # parse tables, so MD013 can skip them

[tool.pymarkdown.plugins.md013]
tables = false  # no line limit in tables
code_blocks = false  # no line limit in code blocks

[tool.pymarkdown.plugins.md060]
enabled = false  # clashes with mdformat's table padding
