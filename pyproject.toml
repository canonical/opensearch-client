#######################################
# PACKAGE                             #
#######################################

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opensearch_client"
version = "0.1.2"
description = "OpenSearch client library."
requires-python = ">=3.10"
dependencies = [
    "requests",
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
os-cli = "opensearch_client.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opensearch_client"]


#######################################
# TOX/TEST CONFIGS                    #
#######################################

[tool.tox]
requires = ["tox>=4.57", "tox-uv>=1.0.0"]
env_list = [
    "lint",
    "type",
    "hygiene",
    "doc-checks",
    # requires-python is >=3.10; 22.04 -> py310 | 24.04 -> py312 | 26.04 -> py314
    "unit-py310",
    "unit-py312",
    "unit-py314",
]

[tool.tox.env_run_base]
package = "wheel"
recreate = true
set_env = { PYTHONPATH = "{tox_root}/src" }

[tool.tox.env.lint]
base_python = "py312"
description = "Check code against coding style standards"
allowlist_externals = ["bash"]
deps = [
    "black",
    "codespell",
    "flake8",
    "flake8-builtins",
    "flake8-docstrings",
    "flake8-docstrings-complete",
    "flake8-pyproject",
    "isort",
    "pylint>=3.3.8",
    "pytest",
]
commands = [
    ["bash", "tests/lint/ascii-check.sh", "py"],
    ["bash", "tests/lint/ascii-check.sh", "sh"],
    ["bash", "-c", "flake8 . || touch .fail"],
    ["bash", "-c", "pylint -j 0 . || touch .fail"],
    ["bash", "-c", "isort --check-only --diff . || touch .fail"],
    ["bash", "-c", "black --check --diff . || touch .fail"],
    ["bash", "-c", "codespell . || touch .fail"],
    ["bash", "-c", "! test -f .fail || ( rm .fail && exit 1 )"],
]

[tool.tox.env.fmt]
description = "Automatically format code"
deps = ["black", "isort", "codespell"]
commands = [
    ["isort", "."],
    ["black", "."],
    ["codespell", "-w", "."],
]

[tool.tox.env.type]
description = "Type-check with basedpyright"
deps = [
    "basedpyright>=1.31.1",
    "pytest",
]
commands = [
    [
        "basedpyright",
        "--pythonpath", "{envpython}",
        "{tox_root}/src", "{tox_root}/tests",
    ],
]

[tool.tox.env.hygiene]
description = "Check for dead code"
deps = ["vulture"]
commands = [["vulture"]]

[tool.tox.env.doc-checks]
description = "Run doc checks"
package = "skip"
allowlist_externals = ["bash"]
deps = [
    "mdformat",
    "mdformat-gfm",
    "mdformat-pyproject",
]
commands = [
    ["bash", "tests/lint/ascii-check.sh", "md"],
    ["mdformat", "--check", "README.md", "docs", "tests"],
]

[tool.tox.env_base.unit]
factors = [["py310", "py312", "py314"]]
description = "Run unit tests"
deps = [
    "coverage[toml]",
    "pytest",
]
commands = [
    [
        "coverage",
        "run",
        "--source=src/opensearch_client",
        "-m",
        "pytest",
        "-s",
        "tests/unit/",
    ],
    ["coverage", "report"],
]

[tool.tox.env.functional]
description = "Run functional tests against a live OpenSearch cluster (see tests/functional/)"
deps = ["pytest"]
pass_env = [
    "OPENSEARCH_URL",
    "OPENSEARCH_HOST",
    "OPENSEARCH_PORT",
    "OPENSEARCH_USER",
    "OPENSEARCH_PASSWORD",
    "OPENSEARCH_CA_CERT",
    "OPENSEARCH_INSECURE",
    "OPENSEARCH_INDEX",
]
commands = [["pytest", "-s", "tests/functional/"]]

[tool.tox.env.actionlint]
description = "Lint GitHub Actions workflows with actionlint"
skip_install = true
deps = ["actionlint-py"]
commands = [["actionlint"]]


#######################################
# TOOL CONFIGS                        #
#######################################

[tool.pyright]
typeCheckingMode = "standard"

[tool.isort]
profile = "black"

[tool.flake8]
exclude = [".git", ".tox", ".venv", "venv", "tests", "build"]
max-line-length = 88
extend-ignore = ["E203", "E701"]

[tool.pylint]
ignore-paths = [".git", ".*.venv", ".*venv", ".*.tox", "build"]
disable = [
    "C0114", "C0116", "C0301",
    "C0303", "C0304", "C0305",
    "C0411", "E0401", "R0801",
    "R0903", "C0105", "R0913",
    "R0917", "W0511",
]

[tool.codespell]
skip = [".venv", "venv", ".git", ".tox", ".pytest_cache"]

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 60

[tool.mdformat]
wrap = 80
